framework:
    rate_limiter:
        ux_disclose:
            policy: fixed_window
            limit: 5
            interval: '1 minute'
            # Serializes concurrent consume() calls through a DBAL lock store,
            # so a burst cannot race past the quota (table auto-created).
            lock_factory: 'app.lock.factory'

# Key the disclosure rate limit on a per-visitor reference instead of the IP,
# so every browser gets an isolated budget.
disclose:
    rate_limiter_subject_factory: App\Disclose\DemoSubjectFactory
